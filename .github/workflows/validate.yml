name: Validate knowledge index
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate registries and internal Markdown links
        run: python scripts/validate.py
      - name: Validate repository Agent Skills
        run: python scripts/validate_skills.py
